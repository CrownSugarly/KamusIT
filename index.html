<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KamusIT - Belajar Istilah Teknologi</title>
    <link rel="stylesheet" href="assets/css/style.css">

<body>
    <header>
        <div class="logo-container">
            <img src="assets/img/logo.svg" alt="Logo">

        <div id="stats" class="stats-bar">Memuat data...</div>

            <button class="filter-btn active" onclick="filterByCategory('All')">Semua</button>

        </div>
    </header>

    <main id="dictionary-container">
        </main>

    <footer>
        <p>Dibuat dengan ❤️ di Linux Mint</p>
    </footer>

    <script src="assets/js/script.js"></script>
